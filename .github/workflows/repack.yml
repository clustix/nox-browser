name: Fast Repack Nox UI

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Base Build (Nightly / Base Binary)
        run: |
          sudo apt-get update && sudo apt-get install -y wget zip unzip xz-utils
          wget -O base-browser.tar.xz "https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=linux64&lang=en-US"
          tar -xf base-browser.tar.xz
          mv firefox nox-browser

      - name: Inject Custom Nox UI into omni.ja
        run: |
          cd nox-browser/browser

          python3 -c '
          import sys, os
          repo_root = os.path.abspath("../..")
          for p in ["python/mozbuild", "third_party/python/six", "python/mach"]:
              sys.path.insert(0, os.path.join(repo_root, p))

          from mozpack.mozjar import JarReader

          reader = JarReader("omni.ja")
          for item in reader:
              filename = item.filename if hasattr(item, "filename") else str(item)
              entry = item if hasattr(item, "read") else reader[item]
              target = os.path.join("omni_extracted", filename)
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, "wb") as f:
                  f.write(entry.read())
          print("omni.ja successfully extracted")
          '
          rm omni.ja

          cp -rf ../../browser/components/preferences/* omni_extracted/chrome/browser/content/browser/preferences/ 2>/dev/null || true
          cp -rf ../../browser/themes/* omni_extracted/chrome/browser/skin/classic/browser/ 2>/dev/null || true

          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("omni.ja", "w", compression=zipfile.ZIP_STORED) as z:
              for root, dirs, files in os.walk("omni_extracted"):
                  for file in files:
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, "omni_extracted")
                      z.write(full_path, rel_path)
          print("omni.ja successfully repacked")
          '
          rm -rf omni_extracted

      - name: Package Final Archive
        run: |
          tar -cJf nox-browser-custom-ui.tar.xz nox-browser/

      - name: Upload Fast UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-custom-ui
          path: nox-browser-custom-ui.tar.xz