name: Fast Repack Nox UI

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Base Build (Nightly / Base Binary)
        run: |
          sudo apt-get update && sudo apt-get install -y wget zip unzip xz-utils
          wget -O base-browser.tar.xz "https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=linux64&lang=en-US"
          tar -xf base-browser.tar.xz
          mv firefox nox-browser

      - name: Inject Custom Nox UI into omni.ja
        run: |
          cd nox-browser/browser

          python3 -c '
          import sys, os
          repo_root = os.path.abspath("../..")
          for p in ["python/mozbuild", "third_party/python/six", "python/mach"]:
              sys.path.insert(0, os.path.join(repo_root, p))

          from mozpack.mozjar import JarReader

          reader = JarReader("omni.ja")
          for item in reader:
              filename = item.filename if hasattr(item, "filename") else str(item)
              entry = item if hasattr(item, "read") else reader[item]
              target = os.path.join("omni_extracted", filename)
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, "wb") as f:
                  f.write(entry.read())
          '
          rm omni.ja

          cp -f ../../browser/components/preferences/main.js omni_extracted/chrome/browser/content/browser/preferences/main.js 2>/dev/null || true
          cp -rf ../../browser/themes/* omni_extracted/chrome/browser/skin/classic/browser/ 2>/dev/null || true

          python3 -c '
          xhtml_path = "omni_extracted/chrome/browser/content/browser/preferences/preferences.xhtml"
          if os.path.exists(xhtml_path):
              with open(xhtml_path, "r", encoding="utf-8") as f:
                  content = f.read()

              glow_markup = """
              <!-- NOX GLOW UI -->
              <html:div id="noxGlowGroup" class="subcategory" data-category="paneGeneral" style="margin-block: 20px;">
                <html:h2 style="font-size: 1.3em; font-weight: 600; margin-bottom: 12px;">Кастомизация свечения Nox UI</html:h2>
                <html:div style="display: flex; align-items: center; justify-content: space-between; margin-block: 10px;">
                  <html:label for="noxGlowColorPicker">Цвет акцентного свечения</html:label>
                  <html:input type="color" id="noxGlowColorPicker" value="#ffffff" style="cursor: pointer; border: none; background: transparent; width: 40px; height: 30px;"/>
                </html:div>
                <html:div style="display: flex; align-items: center; justify-content: space-between; margin-block: 10px;">
                  <html:label for="noxGlowRange">Радиус свечения</html:label>
                  <html:div style="display: flex; align-items: center; gap: 10px;">
                    <html:input type="range" id="noxGlowRange" min="0" max="40" value="12"/>
                    <html:span id="noxGlowRangeValue" style="min-width: 35px; font-variant-numeric: tabular-nums;">12px</html:span>
                  </html:div>
                </html:div>
              </html:div>
              """

              if "</template>" in content:
                  content = content.replace("</template>", glow_markup + "\n</template>", 1)
              
              with open(xhtml_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched preferences.xhtml successfully")
          '

          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("omni.ja", "w", compression=zipfile.ZIP_STORED) as z:
              for root, dirs, files in os.walk("omni_extracted"):
                  for file in files:
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, "omni_extracted")
                      z.write(full_path, rel_path)
          '
          rm -rf omni_extracted

      - name: Package Final Archive
        run: |
          tar -cJf nox-browser-custom-ui.tar.xz nox-browser/

      - name: Upload Fast UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-custom-ui
          path: nox-browser-custom-ui.tar.xz