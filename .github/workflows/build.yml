name: Build Nox Browser

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git mercurial libgtk-3-dev libdbus-glib-1-dev

      - name: Run mach bootstrap
        run: |
          echo "1" | ./mach bootstrap --application-choice=firefox_artifact_mode

      - name: Configure and Build
        run: |
          ./mach configure
          ./mach build

      - name: Package browser
        run: |
          ./mach package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-linux-x86_64
          path: obj-*/dist/nox-*.tar.bz2