name: Fast Build Nox Browser

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git mercurial libgtk-3-dev libdbus-glib-1-dev

      - name: Configure
        run: |
          ./mach configure

      - name: Download Artifacts
        run: |
          ./mach artifact install

      - name: Build
        run: |
          ./mach build

      - name: Package browser
        run: |
          ./mach package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-fast
          path: obj-*/dist/*.tar.*