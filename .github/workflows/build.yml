name: Build Nox Browser

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git mercurial libgtk-3-dev libdbus-glib-1-dev

      - name: Run mach bootstrap
        run: |
          ./mach bootstrap --application-choice=browser_artifact_mode --no-system-changes

      - name: Configure and Download Artifacts
        run: |
          ./mach configure
          ./mach artifact install --tree=mozilla-central || ./mach artifact install

      - name: Build
        run: |
          ./mach build

      - name: Package browser
        run: |
          git clone --depth 1 https://github.com/mozilla-l10n/firefox-l10n l10n
          LOCALES=$(ls -d l10n/* | xargs -n1 basename | tr '\n' ' ')
          L10N_BASEDIR=$PWD/l10n ./mach package-multi-locale --locales $LOCALES

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-linux-x86_64
          path: obj-*/dist/*.tar.*