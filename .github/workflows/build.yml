name: Build Nox Browser (Full Source)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git mercurial libgtk-3-dev libdbus-glib-1-dev \
            libpulse-dev libasound2-dev libx11-xcb-dev libxt-dev \
            clang lld llvm yasm nasm m4 nodejs sccache

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache (Compiler Cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Generate mozconfig for Fast Release Build
        run: |
          cat << 'EOF' > mozconfig
          mk_add_options AUTOCLOBBER=1
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --enable-rust-simd
          ac_add_options --with-ccache=sccache
          EOF

      - name: Run mach bootstrap
        run: |
          ./mach bootstrap --application-choice=browser --no-system-changes

      - name: Build
        env:
          SCCACHE_DIR: /home/runner/.cache/sccache
          SCCACHE_CACHE_SIZE: 10G
        run: |
          sccache --start-server
          ./mach build
          sccache --show-stats

      - name: Package browser
        run: |
          ./mach package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-linux-x86_64
          path: |
            obj-*/dist/nox-*.tar.*
            obj-*/dist/firefox-*.tar.*
            obj-*/dist/*.tar.bz2
            obj-*/dist/*.tar.xz
          if-no-files-found: warn