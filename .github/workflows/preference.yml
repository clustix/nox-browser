name: Build Nox Browser (Preferences Fast Build)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Toolchains & Object Directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.cache/sccache
            ~/.cargo/registry
            ~/.cargo/git
            obj-*
          key: nox-pref-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nox-full-build-${{ runner.os }}-
            nox-pref-build-${{ runner.os }}-

      - name: Install System Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git mercurial libgtk-3-dev libdbus-glib-1-dev \
            clang lld llvm cbindgen yasm nasm m4 nodejs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Preferences
        run: |
          touch CLOBBER obj-*/CLOBBER 2>/dev/null || true
          #./mach build browser/components/preferences
          ./mach build browser/base
          ./mach package

      - name: Package browser
        run: |
          ./mach package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-browser-linux-x86_64
          path: obj-*/dist/*.tar.*